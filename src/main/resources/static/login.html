<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>FINCARD | Login / Signup</title>
    <style>
        :root{--brand:#2563eb}
        *{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",sans-serif}
        body{ min-height:100vh; background:radial-gradient(circle at top left,#1e40af,#020617); display:flex; align-items:center; justify-content:center; overflow:hidden; }

        /* ================= BACKGROUND CARDS ================= */
        .cards{ position:absolute; inset:0; pointer-events:none; }
        .card{ position:absolute; width:340px; height:200px; border-radius:22px; padding:20px; color:#fff; box-shadow:0 40px 80px rgba(0,0,.45); }
        .card::after{ content:""; position:absolute; inset:0; border-radius:22px; background:repeating-linear-gradient( 45deg, rgba(255,255,255,.15) 6px, transparent 6px, transparent 12px ); }
        .card h4{font-size:14px} .card .num{margin:28px 0;font-size:16px;letter-spacing:3px} .card
                                                                                             .row{display:flex;justify-content:space-between;font-size:13px}
        /* card positions */
        .c1{background:linear-gradient(135deg,#2563eb,#020617);top:12%;left:6%;transform:rotate(-8deg);animation:f1 9s infinite}
        .c2{background:linear-gradient(135deg,#9333ea,#312e81);top:35%;left:14%;transform:rotate(6deg);animation:f2 11s infinite}
        .c3{background:linear-gradient(135deg,#0f766e,#022c22);top:15%;right:10%;transform:rotate(8deg);animation:f3 10s infinite}
        .c4{background:linear-gradient(135deg,#f59e0b,#78350f);top:42%;right:18%;transform:rotate(-6deg);animation:f4 12s infinite}

        @keyframes f1{50%{transform:translateY(-20px) rotate(-6deg)}}
        @keyframes f2{50%{transform:translateY(24px) rotate(8deg)}}
        @keyframes f3{50%{transform:translateY(-26px) rotate(10deg)}}
        @keyframes f4{50%{transform:translateY(22px) rotate(-4deg)}}

        /* ================= AUTH CARD ================= */
        .auth{
            width:420px;
            background:#fff;
            border-radius:24px;
            padding:32px;
            box-shadow:0 40px 90px rgba(0,0,0,.5);
            position:relative;
            z-index:10;
        }

        h2{font-size:26px}
        .sub{color:#64748b;margin:6px 0 20px}

        .tabs{display:flex;background:#e5e7eb;border-radius:999px;margin-bottom:18px}
        .tabs button{
            flex:1;padding:12px;border:none;background:transparent;
            font-weight:600;cursor:pointer
        }
        .tabs .active{background:var(--brand);color:#fff;border-radius:999px}

        form{display:none;gap:14px}
        form.active{display:grid}

        input{
            padding:12px 14px;
            border-radius:12px;
            border:1px solid #e5e7eb;
            font-size:14px;
        }

        button.primary{
            background:linear-gradient(135deg,#2563eb,#1e40af);
            color:#fff;
            padding:14px;
            border:none;
            border-radius:14px;
            font-size:15px;
            font-weight:600;
            cursor:pointer;
        }

        .msg{font-size:13px;padding:8px;border-radius:6px;text-align:center}
        .err{background:#ffeaea;color:#b33131}
        .ok{background:#e7f6ea;color:#1b7a2b}
    </style>
</head>

<body>

<!-- BACKGROUND -->
<div class="cards">
    <div class="card c1"><h4>FINCARD • VISA</h4><div class="num">•••• 4921 •••• 8842</div><div class="row"><span>ADRIAN</span><span>09/27</span></div></div>
    <div class="card c2"><h4>FINCARD • MC</h4><div class="num">•••• 1109 •••• 7712</div><div class="row"><span>ALEX</span><span>12/26</span></div></div>
    <div class="card c3"><h4>FINCARD • PLATINUM</h4><div class="num">•••• 3308 •••• 9021</div><div class="row"><span>PERSONAL</span><span>03/28</span></div></div>
    <div class="card c4"><h4>FINCARD • GOLD</h4><div class="num">•••• 7710 •••• 1456</div><div class="row"><span>BUSINESS</span><span>08/29</span></div></div>
</div>

<!-- AUTH -->
<div class="auth">
    <h2 id="title">Login</h2>
    <p class="sub" id="subtitle">Welcome back</p>

    <div class="tabs">
        <button id="tLogin" class="active">Login</button>
        <button id="tSignup">Signup</button>
    </div>

    <!-- LOGIN -->
    <div id="springError" class="msg err" style="display:none">Invalid email or password</div>
    <div id="loginMsg" class="msg" style="display:none"></div>

    <form id="loginForm" class="active" method="post" action="/login">
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <button class="primary" type="submit">Login</button>
    </form>

    <!-- SIGNUP -->
    <div id="signupMsg" class="msg" style="display:none"></div>

    <form id="signupForm">
        <input id="suFirstname" type="text" placeholder="First Name" required>
        <input id="suLastname" type="text" placeholder="Last Name">
        <input id="suEmail" type="email" placeholder="Email" required>
        <input id="suPass" type="password" placeholder="Password" required>
        <button class="primary" type="button" onclick="doSignup()">Create Account</button>
    </form>
</div>

<script>
    const tLogin=document.getElementById("tLogin");
    const tSignup=document.getElementById("tSignup");
    const loginForm=document.getElementById("loginForm");
    const signupForm=document.getElementById("signupForm");
    const title=document.getElementById("title");
    const subtitle=document.getElementById("subtitle");

    function show(tab){
        loginForm.classList.toggle("active",tab==="login");
        signupForm.classList.toggle("active",tab==="signup");
        tLogin.classList.toggle("active",tab==="login");
        tSignup.classList.toggle("active",tab==="signup");
        title.innerText=tab==="login"?"Login":"Sign up";
        subtitle.innerText=tab==="login"?"Welcome back":"Create your account";
    }
    tLogin.onclick=()=>show("login");
    tSignup.onclick=()=>show("signup");

    /* Spring error handling */
    (function(){
        const p=new URLSearchParams(location.search);
        if(p.has("error")){
            document.getElementById("springError").style.display="block";
            show("login");
        }
        if(p.has("logout")){
            const m=document.getElementById("loginMsg");
            m.textContent="You are logged out.";
            m.className="msg ok";
            m.style.display="block";
            show("login");
        }
    })();

    /* Signup API */
    async function doSignup() {
        const firstname = document.getElementById("suFirstname").value.trim();
        const lastname  = document.getElementById("suLastname").value.trim();
        const email     = document.getElementById("suEmail").value.trim();
        const pass      = document.getElementById("suPass").value.trim();
        const msg       = document.getElementById("signupMsg");

        if (!firstname || !email || !pass) {
            msg.textContent = "First name, email and password are required.";
            msg.className = "msg err";
            msg.style.display = "block";
            return;
        }

        // ✅ Correct fields matching RegistrationRequest.java
        const payload = {
            firstname: firstname,
            lastname:  lastname,
            email:     email,
            password:  pass
        };

        try {
            const res = await fetch("/api/v1/registration", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                // ✅ Token ki jagah proper message dikhao
                msg.textContent = "Account created! Please check your email to confirm.";
                msg.className = "msg ok";
                msg.style.display = "block";
                setTimeout(() => show("login"), 2000);
            } else {
                const errText = await res.text();
                msg.textContent = errText || "Signup failed. Try again.";
                msg.className = "msg err";
                msg.style.display = "block";
            }
        } catch {
            msg.textContent = "Network error. Is the server running?";
            msg.className = "msg err";
            msg.style.display = "block";
        }
    }
</script>
</body>
</html>
