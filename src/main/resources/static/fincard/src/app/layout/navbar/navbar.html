<header class="navbar">
  <button type="button" class="navbar__menu-btn" (click)="menuToggle.emit()" aria-label="Toggle sidebar">
    <i class="bx bx-menu" aria-hidden="true"></i>
  </button>

  <form class="navbar__search" role="search" (submit)="$event.preventDefault()">
    <i class="bx bx-search" aria-hidden="true"></i>
    <input type="search" placeholder="Search transactions, banks..." aria-label="Search" />
  </form>

  <div class="navbar__actions">
    <button
      type="button"
      class="navbar__icon-btn"
      (click)="toggleTheme()"
      [attr.aria-pressed]="theme.resolvedTheme() === 'dark'"
      aria-label="Toggle dark mode"
    >
      <i class="bx" [class.bx-moon]="theme.resolvedTheme() === 'light'" [class.bx-sun]="theme.resolvedTheme() === 'dark'"></i>
    </button>

    <button type="button" class="navbar__icon-btn navbar__icon-btn--badge" aria-label="Notifications, 8 unread">
      <i class="bx bxs-bell" aria-hidden="true"></i>
      <span class="navbar__badge">8</span>
    </button>

    <a routerLink="/profile" class="navbar__profile" aria-label="Go to profile">
      <app-avatar [src]="auth.user()?.avatarUrl" [name]="auth.user()?.fullName ?? 'User'" [size]="36" />
    </a>
  </div>
</header>
