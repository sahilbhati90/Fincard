<!DOCTYPE html>
<html>
<head>
    <title>Plaid Test</title>
    <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
</head>
<body>

<button id="connect">Connect Bank</button>

<script>
    document.getElementById("connect").onclick = async () => {

        // backend se link_token lena
        const res = await fetch("http://localhost:8080/api/plaid/create-link-token", {
            method: "POST"
        });
        const data = await res.json();

        const handler = Plaid.create({
            token: data.link_token,

            onSuccess: function (public_token, metadata) {
                console.log("🔥 PUBLIC TOKEN =", public_token);
                alert("Check console for public_token");
            },

            onExit: function () {
                console.log("Exited Plaid");
            }
        });

        handler.open();
    };
</script>

</body>
</html>
